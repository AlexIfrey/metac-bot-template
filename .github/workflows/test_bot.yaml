name: Test Bot

on:
  workflow_dispatch:
    inputs:
      forecaster_model:
        description: "Forecaster model (empty = repository variable FORECASTER_MODEL, then the main.py default)"
        default: ""
      researcher_model:
        description: "Researcher model (empty = repository variable RESEARCHER_MODEL, then the main.py default)"
        default: ""

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      # Exact spend of this run = usage after minus usage before (prints numbers only, never the key).
      - name: OpenRouter credits before
        run: |
          curl -s https://openrouter.ai/api/v1/key -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            | python3 -c "import sys, json; d = json.load(sys.stdin).get('data') or {}; print('before usage:', d.get('usage'), '| limit:', d.get('limit'), '| limit_remaining:', d.get('limit_remaining'))" \
            | tee -a openrouter_credits.log \
            || echo "could not read OpenRouter key info" | tee -a openrouter_credits.log
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Run bot
        run: |
          set -o pipefail
          poetry run python main.py --mode test_questions 2>&1 | tee bot_output.log
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          FORECASTER_MODEL: ${{ inputs.forecaster_model || vars.FORECASTER_MODEL }}
          RESEARCHER_MODEL: ${{ inputs.researcher_model || vars.RESEARCHER_MODEL }}
      - name: OpenRouter credits after
        if: always()
        run: |
          sleep 30
          curl -s https://openrouter.ai/api/v1/key -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            | python3 -c "import sys, json; d = json.load(sys.stdin).get('data') or {}; print('after usage:', d.get('usage'), '| limit:', d.get('limit'), '| limit_remaining:', d.get('limit_remaining'))" \
            | tee -a openrouter_credits.log \
            || echo "could not read OpenRouter key info" | tee -a openrouter_credits.log
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Job logs need a GitHub sign-in to read; annotations are public (no forecast values in them).
      - name: Run summary annotation
        if: always()
        run: python3 .github/scripts/annotate_run.py "Test run summary" bot_output.log openrouter_credits.log